[build]
  command = "remix build"
  publish = "public"
  environment = { SECRETS_SCAN_OMIT_KEYS = "LISTMONK_USERNAME" }
  
[dev]
  command = "remix watch"
  port = 3000

[[redirects]]
  from = "/now"
  to = "https://app.thepoast.com/campaign/bb3d0d27-6689-4162-8844-207a9c597182/644045f5-a135-42b3-bb76-6d9557c055d9"
  status = 200
  force = true

[[redirects]]
  from = "/ad"
  to = "https://app.thepoast.com/campaign/71191bc5-96cf-4080-b760-04bb83b5e616/b40a21cd-3a39-4d7a-9844-290d8b956ae0"
  status = 200
  force = true


[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[[headers]]
  for = "/build/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, s-maxage=31536000"