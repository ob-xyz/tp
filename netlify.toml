[build]
  command = "remix build"
  publish = "public"
  environment = { SECRETS_SCAN_OMIT_KEYS = "LISTMONK_USERNAME" }
  
[dev]
  command = "remix watch"
  port = 3000

[[redirects]]
  from = "/now"
  to = "https://app.thepoast.com/campaign/bb3d0d27-6689-4162-8844-207a9c597182/644045f5-a135-42b3-bb76-6d9557c055d9"
  status = 200
  force = true

[[redirects]]
  from = "/backup"
  to = "https://app.thepoast.com/campaign/611791e4-dfa1-4dae-ab0c-40a5e6fae402/b40a21cd-3a39-4d7a-9844-290d8b956ae0"
  status = 200
  force = true

[[redirects]]
  from = "/test"
  to = "https://app.thepoast.com/campaign/81a5d081-edcf-435a-8d69-a114d148b8a8/b40a21cd-3a39-4d7a-9844-290d8b956ae0"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[[headers]]
  for = "/build/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, s-maxage=31536000"